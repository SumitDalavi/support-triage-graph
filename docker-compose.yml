version: '3.8'

services:
  app:
    build: .
    ports:
      - '8081:8080'
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=8080

  # ── Tier 2 Companion Services (started via: docker compose --profile live up) ──
  postgres:
    image: postgres:15-alpine
    profiles: ["live"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: langgraph_checkpoints
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 5

  zendesk-mock:
    image: wiremock/wiremock:3.2.0
    profiles: ["live"]
    ports:
      - "8080:8080"
    volumes:
      - ./wiremock:/home/wiremock

volumes:
  pgdata:
