version: '3.8'
services:
  app:
    build: .
    ports:
      - '8081:8080'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=langgraph_checkpoints
      - POSTGRES_HOST=postgres
      - ZENDESK_URL=http://zendesk-mock:8080/api/v2/tickets.json
      - LANGCHAIN_TRACING_V2=true
      - LANGCHAIN_PROJECT=support-triage-graph

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: langgraph_checkpoints
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 5

  zendesk-mock:
    image: wiremock/wiremock:3.2.0
    ports:
      - "8080:8080"
    volumes:
      - ./wiremock:/home/wiremock
